<!-- ==================== Approval/Rejection Modal ==================== -->
<div class="withdraw-action-modal-overlay" id="withdraw-action-approval-modal">
  <div class="withdraw-action-modal-container">
    <div class="withdraw-action-modal-header">
      <h3>
        <i class="fa fa-file-invoice-dollar"></i>
        <span id="withdraw-action-modal-title">Withdrawal Action</span>
      </h3>
      <button class="withdraw-action-modal-close" onclick="withdrawActionCloseModal()">
        <i class="fa fa-times"></i>
      </button>
    </div>

    <div class="withdraw-action-modal-body">
      <!-- Status Selection -->
      <div class="withdraw-action-form-group">
        <label>
          Status <span class="withdraw-action-required">*</span>
        </label>
        <select id="withdraw-action-modal-status">
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>

      <!-- Remarks Input -->
      <div class="withdraw-action-form-group">
        <label>
          Remarks <span class="withdraw-action-required">*</span>
        </label>
        <textarea
          id="withdraw-action-modal-remarks"
          placeholder="Enter remarks for this action..."
          maxlength="200"
        ></textarea>
      </div>
    </div>

    <div class="withdraw-action-modal-footer">
      <button
        class="withdraw-action-btn withdraw-action-btn-cancel"
        onclick="withdrawActionCloseModal()"
      >
        <i class="fa fa-times"></i> Cancel
      </button>
      <button
        class="withdraw-action-btn withdraw-action-btn-submit"
        id="withdraw-action-modal-submit-btn"
        onclick="withdrawActionSubmit()"
      >
        <i class="fa fa-check"></i> Submit
      </button>
    </div>
  </div>
</div>
