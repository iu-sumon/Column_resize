 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --mrcnt-mrg-bg-primary: #0d1117;
            --mrcnt-mrg-bg-secondary: #161b22;
            --mrcnt-mrg-bg-tertiary: #21262d;
            --mrcnt-mrg-text-primary: #f0f6fc;
            --mrcnt-mrg-text-secondary: #8b949e;
            --mrcnt-mrg-accent-yellow: #f0b90b;
            --mrcnt-mrg-accent-green: #0ecb81;
            --mrcnt-mrg-accent-red: #f6465d;
            --mrcnt-mrg-border-color: #30363d; 
            --mrcnt-mrg-rhombus-normal-bg:#000000;
        }

        body.mrcnt-mrg-light-mode {
            --mrcnt-mrg-bg-primary: #f8fafc;
            --mrcnt-mrg-bg-secondary: #ffffff;
            --mrcnt-mrg-bg-tertiary: #f1f5f9;
            --mrcnt-mrg-text-primary: #1e293b;
            --mrcnt-mrg-text-secondary: #64748b;
            --mrcnt-mrg-accent-yellow: #f59e0b;
            --mrcnt-mrg-accent-green: #10b981;
            --mrcnt-mrg-accent-red: #ef4444;
            --mrcnt-mrg-border-color: #e2e8f0;
            --mrcnt-mrg-rhombus-normal-bg:#ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--mrcnt-mrg-bg-primary);
            color: var(--mrcnt-mrg-text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .mrcnt-mrg-header {
            background: var(--mrcnt-mrg-bg-secondary);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--mrcnt-mrg-border-color);
        }

        .mrcnt-mrg-header-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .mrcnt-mrg-logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--mrcnt-mrg-accent-yellow);
        }

        .mrcnt-mrg-trade-buttons {
            display: flex;
            gap: 12px;
        }

        .mrcnt-mrg-btn {
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mrcnt-mrg-btn-buy {
            background: var(--mrcnt-mrg-accent-green);
            color: white;
        }

        .mrcnt-mrg-btn-buy:hover {
            background: #0eb876;
            transform: translateY(-1px);
        }

        .mrcnt-mrg-btn-sell {
            background: var(--mrcnt-mrg-accent-red);
            color: white;
        }

        .mrcnt-mrg-btn-sell:hover {
            background: #e5415a;
            transform: translateY(-1px);
        }

        .mrcnt-mrg-theme-toggle {
            background: var(--mrcnt-mrg-bg-tertiary);
            border: 1px solid var(--mrcnt-mrg-border-color);
            color: var(--mrcnt-mrg-text-primary);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mrcnt-mrg-theme-toggle:hover {
            background: var(--mrcnt-mrg-border-color);
        }

        .mrcnt-mrg-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 1000;
            animation: mrcnt-mrg-fadeIn 0.3s;
        }

        @keyframes mrcnt-mrg-fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes mrcnt-mrg-slideUp {
            from { 
                opacity: 0;
                transform: translate(-50%, -45%);
            }
            to { 
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .mrcnt-mrg-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--mrcnt-mrg-bg-secondary);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            z-index: 1001;
            animation: mrcnt-mrg-slideUp 0.3s;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .mrcnt-mrg-modal-header {
            padding: 10px 14px;
            border-bottom: 1px solid var(--mrcnt-mrg-border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mrcnt-mrg-modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .mrcnt-mrg-modal-close {
            background: none;
            border: none;
            color: var(--mrcnt-mrg-text-secondary);
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .mrcnt-mrg-modal-close:hover {
            background: var(--mrcnt-mrg-bg-tertiary);
            color: var(--mrcnt-mrg-text-primary);
        }

        .mrcnt-mrg-modal-body {
            padding: 14px;
        }

        .mrcnt-mrg-order-type {
            display: flex;
            gap: 12px;
            margin-bottom: 10px;
        }

        .mrcnt-mrg-order-type-btn {
            flex: 1;
            padding: 12px;
            background: var(--mrcnt-mrg-bg-tertiary);
            border: 1px solid var(--mrcnt-mrg-border-color);
            color: var(--mrcnt-mrg-text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .mrcnt-mrg-order-type-btn.mrcnt-mrg-active {
            background: var(--mrcnt-mrg-accent-yellow);
            color: #000;
            border-color: var(--mrcnt-mrg-accent-yellow);
        }

        .mrcnt-mrg-margin-btn {
            background: var(--mrcnt-mrg-bg-tertiary);
            border: 1px solid var(--mrcnt-mrg-border-color);
            color: var(--mrcnt-mrg-text-primary);
            padding: 14px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .mrcnt-mrg-margin-btn:hover {
            border-color: var(--mrcnt-mrg-accent-yellow);
        } 

        .mrcnt-mrg-leverage-control {
            margin-bottom: 20px;
        }

        .mrcnt-mrg-leverage-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--mrcnt-mrg-text-secondary);
        }

        .mrcnt-mrg-current-leverage {
            color: var(--mrcnt-mrg-text-primary);
            font-weight: 600;
        }

        .mrcnt-mrg-leverage-input {
            width: 100%;
            padding: 12px;
            background: var(--mrcnt-mrg-bg-tertiary);
            border: 1px solid var(--mrcnt-mrg-border-color);
            border-radius: 6px;
            color: var(--mrcnt-mrg-text-primary);
            font-size: 15px;
            margin-bottom: 16px;
        }

        .mrcnt-mrg-leverage-input:focus {
            outline: none;
            border-color: var(--mrcnt-mrg-accent-yellow);
        }
             
        .mrcnt-mrg-container {
            width: 100%;   
            background: var(--mrcnt-mrg-bg-tertiary);
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
        } 
        
        .mrcnt-mrg-street-container {
            position: relative;
            margin: 50px 0;
            padding: 0 20px;
        }
        
        .mrcnt-mrg-street-line {
            height: 1px;
            background: linear-gradient(90deg, #333 0%, #555 50%, #333 100%);
            border-radius: 2px;
            position: relative;
        }
        
        .mrcnt-mrg-street-line::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px; 
            transform: translateY(-50%);
        }
        
        .mrcnt-mrg-rhombus-container {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }
        
        .mrcnt-mrg-rhombus-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .mrcnt-mrg-rhombus {
            width: 10px;
            height: 10px;
            background: var(--mrcnt-mrg-rhombus-normal-bg);
            transform: rotate(45deg);
            cursor: pointer;
            position: relative;
            transition: all 0.3s ease;
            border: 1px solid #666;
            margin-bottom: 8px;
            top: 14px;
        }
     

        .mrcnt-mrg-rhombus:hover { 
            background: #555;
        }
        
        .mrcnt-mrg-rhombus.mrcnt-mrg-active {
            background: var(--mrcnt-mrg-accent-yellow);
            border-color: var(--mrcnt-mrg-accent-yellow);  
        }
        
        .mrcnt-mrg-rhombus-value {
            color: var(--mrcnt-mrg-text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            position: relative;
            top: 15px;
            transform: none;
            transition: color 0.3s ease;
        }
        
        .mrcnt-mrg-rhombus-value.mrcnt-mrg-active {
            color: var(--mrcnt-mrg-text-primary); 
        }
        
        .mrcnt-mrg-selection-indicator {
            position: absolute;
            top: 50%;
            left: -6px;
            height: 1px;
            background: var(--mrcnt-mrg-accent-yellow);  
            transform: translateY(-50%);
            transition: all 0.4s ease;
            z-index: 1;
            opacity: 0;
        }  
        .mrcnt-mrg-modal-footer {
            display: flex;
            gap: 12px;
        }

        .mrcnt-mrg-btn-cancel {
            flex: 1;
            background: var(--mrcnt-mrg-bg-tertiary);
            color: var(--mrcnt-mrg-text-primary);
            border: 1px solid var(--mrcnt-mrg-border-color);
        }

        .mrcnt-mrg-btn-cancel:hover {
            background: var(--mrcnt-mrg-border-color);
        }

        .mrcnt-mrg-btn-confirm {
            flex: 1;
            background: var(--mrcnt-mrg-accent-yellow);
            color: #000;
            font-weight: 600;
        }

        .mrcnt-mrg-btn-confirm:hover {
            background: #f5c542;
        }

        /* Toggle Switch */
        .mrcnt-mrg-toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--mrcnt-mrg-bg-tertiary);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid var(--mrcnt-mrg-border-color);
        }

        .mrcnt-mrg-toggle-switch.mrcnt-mrg-active {
            background: var(--mrcnt-mrg-accent-yellow);
        }

        .mrcnt-mrg-toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .mrcnt-mrg-toggle-switch.mrcnt-mrg-active .mrcnt-mrg-toggle-slider {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <div class="mrcnt-mrg-header">
        <div class="mrcnt-mrg-header-left">
            <div class="mrcnt-mrg-logo">⚡ TradeX</div>
            <div class="mrcnt-mrg-trade-buttons">
                <button class="mrcnt-mrg-btn mrcnt-mrg-btn-buy" id="mrcnt-mrg-buyBtn">Buy</button>
                <button class="mrcnt-mrg-btn mrcnt-mrg-btn-sell" id="mrcnt-mrg-sellBtn">Sell</button>
            </div>
        </div>
        <button class="mrcnt-mrg-theme-toggle" id="mrcnt-mrg-themeToggle">🌓 Theme</button>
    </div>

    <!-- Order Window Modal -->
    <div class="mrcnt-mrg-modal-overlay" id="mrcnt-mrg-orderModalOverlay">
        <div class="mrcnt-mrg-modal">
            <div class="mrcnt-mrg-modal-header">
                <h2 class="mrcnt-mrg-modal-title" id="mrcnt-mrg-orderModalTitle">Buy BTC/USDT</h2>
                <button class="mrcnt-mrg-modal-close" id="mrcnt-mrg-closeOrderModal">&times;</button>
            </div>
            <div class="mrcnt-mrg-modal-body">
                <div class="mrcnt-mrg-order-type">
                    <button class="mrcnt-mrg-order-type-btn mrcnt-mrg-active" id="mrcnt-mrg-marginBtn">Margin</button> 
                </div>  
            </div>
        </div>
    </div>

    <!-- Margin Modal -->
    <div class="mrcnt-mrg-modal-overlay" id="mrcnt-mrg-marginModalOverlay">
        <div class="mrcnt-mrg-modal">
            <div class="mrcnt-mrg-modal-header">
                <h2 class="mrcnt-mrg-modal-title">Adjust Max Leverage</h2>
                <button class="mrcnt-mrg-modal-close" id="mrcnt-mrg-closeMarginModal">&times;</button>
            </div>
            <div class="mrcnt-mrg-modal-body"> 
                <div class="mrcnt-mrg-leverage-control">
                    <div class="mrcnt-mrg-leverage-label">
                        <span>Max Leverage</span>
                        <span class="mrcnt-mrg-current-leverage">Current: <span id="mrcnt-mrg-currentLeverage">1.0</span>x</span>
                    </div>

                    <input type="number" class="mrcnt-mrg-leverage-input" id="mrcnt-mrg-leverageInput" value="" step="0.1" min="0.1" max="1.0">

                    <div class="mrcnt-mrg-container"> 
                        <div class="mrcnt-mrg-street-container">
                            <div class="mrcnt-mrg-street-line">
                                <div class="mrcnt-mrg-selection-indicator" id="mrcnt-mrg-selectionIndicator"></div>
                            </div>
                            <div class="mrcnt-mrg-rhombus-container">
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.1"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.1</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.2"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.2</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.3"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.3</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.4"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.4</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.5"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.5</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.6"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.6</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.7"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.7</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.8"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.8</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="0.9"></div>
                                    <span class="mrcnt-mrg-rhombus-value">0.9</span>
                                </div>
                                <div class="mrcnt-mrg-rhombus-wrapper">
                                    <div class="mrcnt-mrg-rhombus" data-value="1.0"></div>
                                    <span class="mrcnt-mrg-rhombus-value">1.0</span>
                                </div>
                            </div>
                        </div> 
                    </div>
                </div>  
                <div class="mrcnt-mrg-modal-footer">
                    <button class="mrcnt-mrg-btn mrcnt-mrg-btn-cancel" id="mrcnt-mrg-cancelMarginBtn">Cancel</button>
                    <button class="mrcnt-mrg-btn mrcnt-mrg-btn-confirm" id="mrcnt-mrg-confirmMarginBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

<script>
$(function () {
    let mrcntMrgCurrentLeverageValue = 0.1;

    // ==================== Theme Toggle ==================== //
    $("#mrcnt-mrg-themeToggle").on("click", function () {
        $("body").toggleClass("mrcnt-mrg-light-mode");
    });

    // ==================== Open Order Modal ==================== //
    $("#mrcnt-mrg-buyBtn, #mrcnt-mrg-sellBtn").on("click", function () {
        const type = this.id === "mrcnt-mrg-buyBtn" ? "Buy" : "Sell";
        $("#mrcnt-mrg-orderModalTitle").text(`${type} BTC/USDT`);
        $("#mrcnt-mrg-orderModalOverlay").fadeIn(250);
    });

    // ==================== Close Order Modal ==================== //
    $("#mrcnt-mrg-closeOrderModal, #mrcnt-mrg-orderModalOverlay").on("click", function (e) {
        if (e.target === this || e.target.id === "mrcnt-mrg-closeOrderModal") {
            $("#mrcnt-mrg-orderModalOverlay").fadeOut(250);
        }
    });

    // ==================== Open Margin Modal ==================== //
    $("#mrcnt-mrg-marginBtn").on("click", function () {
        $("#mrcnt-mrg-orderModalOverlay").fadeOut(250, function () {
            $("#mrcnt-mrg-marginModalOverlay").fadeIn(250);
        });
    });

    // ==================== Close Margin Modal ==================== //
    $("#mrcnt-mrg-closeMarginModal, #mrcnt-mrg-cancelMarginBtn, #mrcnt-mrg-marginModalOverlay").on("click", function (e) {
        if (e.target === this || e.target.id === "mrcnt-mrg-closeMarginModal" || e.target.id === "mrcnt-mrg-cancelMarginBtn") {
            $("#mrcnt-mrg-marginModalOverlay").fadeOut(250);
        }
    });

    // ==================== Confirm Margin ==================== //
    $("#mrcnt-mrg-confirmMarginBtn").on("click", function () {
        const leverage = parseFloat($("#mrcnt-mrg-leverageInput").val()) || 0.1;
        const validLeverage = Math.min(Math.max(leverage, 0.1), 1.0);
        mrcntMrgCurrentLeverageValue = validLeverage;
        $("#mrcnt-mrg-currentLeverage").text(validLeverage.toFixed(1));
        $("#mrcnt-mrg-marginModalOverlay").fadeOut(250, function () {
            $("#mrcnt-mrg-orderModalOverlay").fadeIn(250);
        });
    });

    // ==================== Order Type Button ==================== //
    $(".mrcnt-mrg-order-type-btn").on("click", function () {
        $(".mrcnt-mrg-order-type-btn").removeClass("mrcnt-mrg-active");
        $(this).addClass("mrcnt-mrg-active");
    });

    // ==================== Leverage Input Change ==================== //
    $("#mrcnt-mrg-leverageInput").on("input", function () {
        let value = parseFloat($(this).val());
        if (isNaN(value)) value = 0.1;
        value = Math.min(Math.max(value, 0.1), 1.0);
        value = parseFloat(value.toFixed(1));

        $(this).val(value);
        mrcntMrgCurrentLeverageValue = value;
        mrcntMrgUpdateRhombusSelection(value);
        mrcntMrgShowBorrowAmount(value);
    });

    // ==================== Rhombus Click ==================== //
    $(".mrcnt-mrg-rhombus").on("click", function () {
        const value = parseFloat($(this).data("value"));
        mrcntMrgCurrentLeverageValue = value;
        $("#mrcnt-mrg-leverageInput").val(value.toFixed(1));
        mrcntMrgUpdateRhombusSelection(value);
        mrcntMrgShowBorrowAmount(value);
    });

    // ==================== Rhombus Selection Indicator ==================== //
    function mrcntMrgUpdateRhombusSelection(selectedValue) {
        const $rhombuses = $(".mrcnt-mrg-rhombus");
        const $indicator = $("#mrcnt-mrg-selectionIndicator");

        $rhombuses.each(function () {
            const value = parseFloat($(this).data("value"));
            const $label = $(this).siblings(".mrcnt-mrg-rhombus-value");

            if (value <= selectedValue) {
                $(this).addClass("mrcnt-mrg-active");
                $label.addClass("mrcnt-mrg-active");
            } else {
                $(this).removeClass("mrcnt-mrg-active");
                $label.removeClass("mrcnt-mrg-active");
            }
        });

        // Adjust indicator line
        const $selected = $(`.mrcnt-mrg-rhombus[data-value='${selectedValue.toFixed(1)}']`);
        if ($selected.length) {
            const firstLeft = $(".mrcnt-mrg-rhombus").first().offset().left;
            const selectedLeft = $selected.offset().left;
            const width = selectedLeft - firstLeft + $selected.outerWidth() / 2;

            $indicator.css({
                width: width + "px",
                opacity: 1,
            });
        } else {
            $indicator.css({ opacity: 0 });
        }
    }

    // ==================== Borrow Amount Console Log ==================== //
    function mrcntMrgShowBorrowAmount(leverage) {
        const btc = leverage.toFixed(1);
        const usdt = (leverage * 100).toFixed(0);
        console.log(`Borrow Estimation → ${btc} BTC or ${usdt} USDT`);
    }

    // ==================== Initialize ==================== //
    $("#mrcnt-mrg-leverageInput").val(mrcntMrgCurrentLeverageValue.toFixed(1));
    mrcntMrgUpdateRhombusSelection(mrcntMrgCurrentLeverageValue);
});
</script>


</body>
</html>
