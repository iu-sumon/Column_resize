<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modern Leaderboard</title>

  <!-- Bootstrap 4.1.3 -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">

  <style>
    :root {
      --primary: #007bff;
      --success: #28a745;
      --danger: #dc3545;
      --border-radius: 14px;
      --transition: all 0.3s ease;
    }

    /* Themes */
    [data-theme="light"] {
      --bg: #f5f7fa;
      --card-bg: #ffffff;
      --text-color: #1e1e1e;
      --header-bg: #f0f2f5;
      --table-header: #f8f9fa;
    }

    [data-theme="dark"] {
      --bg: #0f1116;
      --card-bg: #1b1f27;
      --text-color: #f5f5f5;
      --header-bg: #21262d;
      --table-header: #2b313a;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text-color);
      transition: var(--transition);
    }

    .leaderboard-container {
      max-width: 1000px;
      margin: 60px auto;
      background: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: var(--transition);
    }

    .leaderboard-header {
      background: var(--header-bg);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 25px;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .leaderboard-header h4 {
      margin: 0;
      font-weight: 600;
      font-size: 1.3rem;
    }

    .leaderboard-header .last-update {
      font-size: 0.9rem;
      opacity: 0.85;
      margin-right: 15px;
    }

    .refresh-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s ease-in-out;
    }

    .refresh-btn:hover {
      background: #0056b3;
      transform: scale(1.05);
    }

    .table-modern {
      width: 100%;
      border-collapse: collapse;
      border-radius: var(--border-radius);
      overflow: hidden;
    }

    .table-modern thead {
      background: var(--table-header);
      color: var(--text-color);
      font-weight: 600;
    }

    .table-modern tbody tr {
      transition: background 0.2s ease;
    }

    .table-modern tbody tr:hover {
      background: rgba(0,123,255,0.1);
    }

    .table-modern td, .table-modern th {
      padding: 14px 20px;
      text-align: left;
      font-size: 0.95rem;
    }

    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--header-bg);
      color: var(--text-color);
      font-size: 0.9rem;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: var(--transition);
    }

    .theme-toggle:hover {
      opacity: 0.8;
      transform: scale(1.05);
    }

    /* Highlight animation when refreshed */
    .highlight {
      animation: flash 1s ease-in-out;
    }

    @keyframes flash {
      0% { background-color: rgba(0,255,0,0.2); }
      100% { background-color: transparent; }
    }

    @media (max-width: 768px) {
      .table-modern td, .table-modern th {
        padding: 10px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="leaderboard-container">
    <div class="leaderboard-header">
      <h4>🏆 Leaderboard</h4>
      <div class="d-flex align-items-center">
        <span class="last-update">Last Updated: <span id="lastUpdated"></span></span>
        <button id="refreshBtn" class="refresh-btn">↻ Refresh</button>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table-modern table-dark table-striped mb-0">
        <thead>
          <tr>
            <th>Client Code</th>
            <th>Name</th>
            <th>Total Cash</th>
            <th>Current Cash</th>
            <th>Market Value</th>
            <th>RY</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody">
          <tr>
            <td>CL001</td>
            <td>John Doe</td>
            <td>$10,000</td>
            <td>$9,800</td>
            <td>$15,200</td>
            <td>12%</td>
          </tr>
          <tr>
            <td>CL002</td>
            <td>Jane Smith</td>
            <td>$8,500</td>
            <td>$8,600</td>
            <td>$12,100</td>
            <td>10%</td>
          </tr>
          <tr>
            <td>CL003</td>
            <td>Michael Lee</td>
            <td>$12,000</td>
            <td>$11,900</td>
            <td>$18,400</td>
            <td>15%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle">🌙 Dark Mode</button>

  <!-- jQuery + Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"></script>

  <script>
    function updateTimestamp() {
      const now = new Date();
      $('#lastUpdated').text(now.toLocaleTimeString());
    }

    function refreshTable() {
      const data = [
        { code: "CL001", name: "John Doe", total: "$10,000", current: "$9,850", market: "$15,600", ry: "12.5%" },
        { code: "CL002", name: "Jane Smith", total: "$8,500", current: "$8,550", market: "$12,250", ry: "10.2%" },
        { code: "CL003", name: "Michael Lee", total: "$12,000", current: "$11,950", market: "$18,650", ry: "15.5%" }
      ];

      const tbody = $('#leaderboardBody');
      tbody.empty();
      data.forEach(row => {
        tbody.append(`
          <tr class="highlight">
            <td>${row.code}</td>
            <td>${row.name}</td>
            <td>${row.total}</td>
            <td>${row.current}</td>
            <td>${row.market}</td>
            <td>${row.ry}</td>
          </tr>
        `);
      });

      updateTimestamp();
    }

    $(document).ready(function () {
      updateTimestamp();

      $('#refreshBtn').on('click', function () {
        refreshTable();
      });

      $('#themeToggle').on('click', function () {
        const theme = $('html').attr('data-theme');
        if (theme === 'light') {
          $('html').attr('data-theme', 'dark');
          $(this).text('☀️ Light Mode');
        } else {
          $('html').attr('data-theme', 'light');
          $(this).text('🌙 Dark Mode');
        }
      });
    });
  </script>
</body>
</html>
