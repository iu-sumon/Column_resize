<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Modern Login Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Bootstrap 4.1 CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
   body, html {
    height: 100%;
    margin: 0;
    background: #f8f9fa;
    position: relative;
    overflow: hidden; /* This prevents scrollbars */
}

.bg-image-top-left, .bg-image-bottom-right {
    position: absolute;
    z-index: 0;
    max-width: 100vw;
    max-height: 100vh;
}

.bg-image-top-left {
    width: 870px;
    height: 1092px;
    top: -226px;
    left: -272px;
    opacity: 0.3;
    transform: rotate(8.47deg);
}


.bg-image-bottom-right {
    width: 1210px;
    height: 1210px;
    top: auto;
    left: auto;
    bottom: -224px;
    right: -358px;
    opacity: 0.3;
}

    .login-container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    
.login-card {
    width: 1000px;
    height: 547px;
    background-image: url(/images/center-eilipsis.svg);
    background-repeat: no-repeat;
    background-position: center;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 172px;
}

/* New glass effect element */
.glass-effect {
    position: absolute;
    top: 0;
    left: 0;
    width: 1000px;
    height: 547px;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(17px);
    border-radius: 10px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    z-index: -1;
}
    .form-control {
      border-radius: 30px;
    }

    .btn-login {
      border-radius: 30px;
    }

    .login-qweb-image{
      width: 375px;
      height: 200px; 
    }

    /* for login */
    /* .lgin-login-container {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px); 
      border-radius: 15px;
      text-align: center;
      color: #000000; 
      width: 335px; 
    } */

    .lgin-login-container {
      /* background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px); 
      border-radius: 15px;
      text-align: center;
      color: #000000;  */
      width: 335px; 
    }
 
    .lgin-logo {
      font-size: 2em;
      color: #00d4ff;
      margin-bottom: 6px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .lgin-logo span {
      color: #dddddd;
      font-weight: 400;
    }
    .lgin-input-group {
      margin: 15px 0;
      text-align: left;
      position: relative;
    }
    .lgin-input-group i {
      position: absolute;
      left: 7px;
      top: 50%;
      transform: translateY(-50%);
      color: #808080;
      transition: color 0.3s ease;
    }
    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 12px 12px 12px 40px; 
      border: 1px solid rgba(110, 110, 110, 0.2);
      border-radius: 8px;
      background: rgba(100, 100, 100, 0.05);
      color: #000000;
      font-size: 12px;
      transition: box-shadow 0.3s ease;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    }
    .lgin-input-group:focus-within i {
      color: #00d4ff;
    }

    /* Eye icon styles */
    .lgin-password-toggle {
      position: absolute;
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #808080;
    }

    .lgin-remember-me {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 15px 0;
      font-size: 0.9em;
    }
    .lgin-remember-me input {
      margin-right: 5px;
      accent-color: #00d4ff;
    }
    .lgin-forgot-password {
      color: #ff6b6b;
      text-decoration: none;
      font-size: 0.9em;
      transition: color 0.3s ease;
    }
    .lgin-forgot-password:hover {
      color: #ff8787;
    }
    .lgin-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(90deg, #00d4ff, #0088cc);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, background 0.3s ease;
    }
    .lgin-btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(90deg, #0088cc, #00d4ff);
    }
    .lgin-btn i {
      margin-left: 8px;
    }

     .social-icons {
      margin-top: 35px;
      text-align: center;
    }
    .social-icons img {
      width: 30px;
      margin: 0 10px;
      cursor: pointer;
    }
    .product-by{
        margin-top: 35px;
    }

    .footer-info {
  position: absolute;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  color: #555;
  font-size: 0.85rem;
  z-index: 1;
}
.footer-info span, .footer-info b {
  color: #000;
}

  </style>
</head>
<body>

  <!-- Corrected Background Images from Unsplash -->
  <img src="/images/top-left.png" class="bg-image-top-left" alt="Top Left">
  <img src="/images/bottom-right.png" class="bg-image-bottom-right" alt="Bottom Right">

  <!-- Login Form -->
   <div>
    <div class="login-container">
        <div class="login-card text-center">
        <!-- Glass effect element added here -->
        <div class="glass-effect"></div>
        <div>
            <div class="lgin-login-container">
                <div class="lgin-logo">
                    <img class="lighttheme" src="/images/broker-logo-light.png" alt="broker logo" width="200" height="50">
                </div>
                    <h3>Welcome Back !</h3>
                    <p>Please login to continue</p>
                <form>
                    <div class="lgin-input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" placeholder="Username" />
                    </div>
                    <div class="lgin-input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" placeholder="Password" id="lgin-password-field" />
                        <span class="lgin-password-toggle">
                        <i class="fas fa-eye-slash" id="lgin-eye-icon"></i>
                        </span>
                    </div>
                    <div class="lgin-remember-me">
                        <label><input type="checkbox" /> Remember Me</label>
                        <a href="#" class="lgin-forgot-password">Forgot Password?</a>
                    </div>
                    <button type="submit" class="lgin-btn">Login <i class="fas fa-arrow-right"></i></button>
                </form>
            </div>
            <div>
                    <div class="social-icons">
                    <img src="https://img.icons8.com/color/48/google-logo.png" alt="Google">
                    <img src="https://img.icons8.com/ios-filled/50/000000/mac-os.png" alt="Apple">
                    </div>
                    <div class="product-by">
                        <span class="pr-3">Product by</span>
                        <span><img src="/images/uftcl-logo.jpg" width="100" height="35" alt="United Finance"> </span>
                    </div>
            </div>
        </div>
        <div>
            <img class="login-qweb-image" src="/images/qweb.png" alt="Logo">
        </div>
        </div> 
    </div> 
    <div class="footer-info">
             <div class="d-flex justify-content-center">
                <span> Powered by</span>
                <span><img src="/images/qtrader-logo-dark.png" alt="qTrader Logo" width="100" height="40"></span>
             </div> 
            UFTFAST Platform v1.5.22 | Copyright © 2025 qTrader | Developed by <span>Quant FinTech Limited</span>
            
    </div>
  </div>
</body>
</html>
