<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdrawal Request System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        :root {
            --withdraw-bg-primary: #ffffff;
            --withdraw-bg-secondary: #f8f9fa;
            --withdraw-bg-tertiary: #f1f3f4;
            --withdraw-input-bg: #ffffff;
            --withdraw-input-border: #e1e5e9;
            --withdraw-text-primary: #2d3748;
            --withdraw-text-secondary: #4a5568;
            --withdraw-text-tertiary: #718096;
            --withdraw-border-color: #e2e8f0;
            --withdraw-hover-bg: #f7fafc;
            --withdraw-primary: #667eea;
            --withdraw-secondary: #764ba2;
        }

        .withdraw-container {
            max-width: 1800px;
            margin: 0 auto;
            background: var(--withdraw-bg-primary);
            border-radius: 16px;
            overflow: hidden;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .withdraw-main-content {
            padding: 25px;
        }

        .withdraw-controls-section {
            display: flex;
            justify-content: space-between;
            gap: 30px;
            margin-bottom: 30px;
        }

        .withdraw-filters {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
        }

        .withdraw-filter-group {
            display: flex;
            flex-direction: column;
        }

        .withdraw-client-code-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .withdraw-client-code-wrapper input {
            flex: 1;
        }

        .withdraw-client-code-wrapper .withdraw-btn-clear {
            height: 36px;
            padding: 0 13px;
        }

        .withdraw-date-range-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            position: relative;
        }

        .withdraw-date-range-wrapper input {
            flex: 1;
            padding: 7px 14px;
            border: 2px solid var(--withdraw-input-border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--withdraw-input-bg);
            color: var(--withdraw-text-primary);
            font-family: inherit;
            min-width: 180px;
        }

        .withdraw-date-range-wrapper .input-group-append {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            pointer-events: none;
        }

        .withdraw-filter-group input,
        .withdraw-filter-group select {
            width: 100%;
            padding: 7px 14px;
            border: 2px solid var(--withdraw-input-border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--withdraw-input-bg);
            color: var(--withdraw-text-primary);
            font-family: inherit;
        }

        .withdraw-filter-group input:focus,
        .withdraw-filter-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .withdraw-date-range-wrapper input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Red star for required labels */
        label::after {
            content: attr(data-required);
            color: red;
            margin-left: 4px;
            font-weight: bold;
        }

        .withdraw-btn-clear {
            padding: 12px 16px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .withdraw-btn-clear:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }

        .withdraw-actions {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .withdraw-btn {
            padding: 7px 8px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .withdraw-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .withdraw-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .withdraw-btn-secondary {
            background: var(--withdraw-bg-tertiary);
            color: var(--withdraw-text-primary);
            border: 2px solid var(--withdraw-border-color);
        }

        .withdraw-btn-secondary:hover {
            background: var(--withdraw-hover-bg);
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .withdraw-table-wrapper {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--withdraw-border-color);
            background: var(--withdraw-bg-primary);
        }

        .withdraw-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--withdraw-bg-primary);
        }

        .withdraw-thead {
            background: var(--withdraw-bg-secondary);
            border-bottom: 2px solid var(--withdraw-border-color);
        }

        .withdraw-th {
            padding: 10px;
            text-align: left;
            font-weight: 600;
            color: var(--withdraw-text-primary);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .withdraw-td {
            padding: 7px;
            font-size: 14px;
            color: var(--withdraw-text-secondary);
        }

        .withdraw-tbody tr {
            transition: all 0.3s ease;
            background: var(--withdraw-bg-primary);
        }

        .withdraw-tbody tr:hover {
            background: var(--withdraw-hover-bg);
        }

        .withdraw-amount {
            font-weight: 600;
            color: #667eea;
        }

        .withdraw-empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--withdraw-text-tertiary);
        }

        .withdraw-empty-state p {
            font-size: 16px;
        }

        /* Modal */
        .withdraw-modal {
            background: var(--withdraw-bg-primary);
        }

        .withdraw-modal-content {
            padding: 15px;
        }

        .withdraw-form-row {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .withdraw-form-row.withdraw-full {
            grid-template-columns: 1fr;
        }

        .withdraw-form-group {
            display: flex;
            flex-direction: column;
        }

        .withdraw-form-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--withdraw-text-primary);
            margin-bottom: 10px;
        }

        .withdraw-form-group input,
        .withdraw-form-group textarea {
            padding: 8px 14px;
            border: 2px solid var(--withdraw-input-border);
            border-radius: 8px;
            font-size: 14px;
            background: var(--withdraw-input-bg);
            color: var(--withdraw-text-primary);
            transition: all 0.3s ease;
        }

        #withdrawNarration {
            height: 85px;
        }

        .withdraw-form-group input:focus,
        .withdraw-form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .withdraw-modal-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--withdraw-border-color);
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .withdraw-modal-footer .withdraw-btn {
            padding: 12px 32px;
            min-width: 120px;
        }

        /* Flatpickr customization */
        .flatpickr-calendar {
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            background: var(--withdraw-bg-primary);
            border: 1px solid var(--withdraw-border-color);
        }

        .flatpickr-day.selected {
            background: var(--withdraw-primary);
            border-color: var(--withdraw-primary);
        }

        .flatpickr-time input:hover,
        .flatpickr-time .flatpickr-am-pm:hover,
        .flatpickr-time input:focus,
        .flatpickr-time .flatpickr-am-pm:focus {
            background: var(--withdraw-primary);
            color: white;
        }

        /* Responsive adjustments */
        @media (max-width: 992px) {
            .withdraw-controls-section {
                flex-direction: column;
            }

            .withdraw-filters {
                flex-direction: column;
            }

            .withdraw-date-range-wrapper {
                flex-direction: column;
            }

            .withdraw-form-row {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 768px) {
            .withdraw-form-row {
                grid-template-columns: 1fr;
            }

            .withdraw-actions {
                flex-direction: column;
                width: 100%;
            }

            .withdraw-actions .withdraw-btn {
                width: 100%;
            }
            
            .withdraw-date-range-wrapper input {
                min-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="withdraw-container">
        <div class="withdraw-main-content">
            <div class="withdraw-controls-section">
                <div class="withdraw-filters">
                    <div class="withdraw-date-range-wrapper">
                        <input type="text" id="withdrawClientCode" placeholder="Enter client code...">
                    </div>

                    <div class="withdraw-date-range-wrapper">
                        <input id="withdrawStartDate" class="form-control border field-border-color bg-date-color" type="text"
                            placeholder="From Date & Time" />
                        <div class="input-group-append">
                            <span class="input-group-text" style="color: #ffff; background: #313242; border: 0px;"><i
                                    class="fa fa-calendar"></i></span>
                        </div>
                    </div>

                    <div class="withdraw-date-range-wrapper">
                        <input id="withdrawEndDate" class="form-control border field-border-color bg-date-color" type="text"
                            placeholder="To Date & Time" />
                        <div class="input-group-append">
                            <span class="input-group-text" style="color: #ffff; background: #313242; border: 0px;"><i
                                    class="fa fa-calendar"></i></span>
                        </div>
                    </div>

                    <div class="withdraw-date-range-wrapper">
                        <button id="btn-withdraw-search" type="button" class="withdraw-btn withdraw-btn-primary"><i
                                class="fa fa-search"></i> Search</button>

                        <button class="withdraw-btn-clear" id="withdraw-btn-clear">
                            <i class="fa fa-times" aria-hidden="true"></i> Clear
                        </button>
                    </div>
                </div>

                <div class="withdraw-actions">
                    <button class="withdraw-btn withdraw-btn-primary" id="withdraw-btn-request">
                        <i class="fa fa-plus" aria-hidden="true"></i> Withdraw Request
                    </button>
                    <button class="withdraw-btn withdraw-btn-secondary" id="withdraw-btn-download">
                        <i class="fa fa-download" aria-hidden="true"></i> Download
                    </button>
                </div>
            </div>

            <div class="withdraw-table-wrapper">
                <table class="withdraw-table" id="withdrawDataTable">
                    <thead class="withdraw-thead">
                        <tr>
                            <th class="withdraw-th">Client Code</th>
                            <th class="withdraw-th">Name</th>
                            <th class="withdraw-th">Date & Time</th>
                            <th class="withdraw-th">Amount</th>
                            <th class="withdraw-th">User</th>
                        </tr>
                    </thead>
                    <tbody class="withdraw-tbody" id="withdrawTableBody"></tbody>
                </table>
            </div>

            <div style="display: none">
                <div id="withdraw-request">
                    <div class="withdraw-modal">
                        <div class="withdraw-modal-content">
                            <form onsubmit="withdrawSubmitWithdrawRequest(event)">
                                <div class="withdraw-form-row">
                                    <div class="withdraw-form-group">
                                        <label data-required="*">Client Code</label>
                                        <input type="text" id="withdrawAbleClientCode" required>
                                    </div>
                                    <div class="withdraw-form-group">
                                        <label data-required="*">Name</label>
                                        <input type="text" id="withdrawName" required>
                                    </div>
                                </div>
                                <div class="withdraw-form-row">
                                    <div class="withdraw-form-group">
                                        <label data-required="*">Balance</label>
                                        <input type="number" id="withdrawBalance" required>
                                    </div>
                                    <div class="withdraw-form-group">
                                        <label data-required="*">Withdraw Amount</label>
                                        <input type="number" id="withdrawAmount" required>
                                    </div>
                                </div>
                                <div class="withdraw-form-row withdraw-full">
                                    <div class="withdraw-form-group">
                                        <label data-required="*">Narration</label>
                                        <textarea id="withdrawNarration" required></textarea>
                                    </div>
                                </div>
                                <div class="withdraw-modal-footer">
                                    <button type="submit" class="withdraw-btn withdraw-btn-primary">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize date pickers with time functionality
        const withdrawStartDatePicker = flatpickr("#withdrawStartDate", {
            enableTime: true,
            dateFormat: "Y-m-d H:i",
            altFormat: "d-m-Y H:i",
            altInput: true,
            defaultDate: new Date(),
            time_12hr: true,
            minuteIncrement: 1,
            onReady: function(selectedDates, dateStr, instance) {
                var $cal = $(instance.calendarContainer);
                if ($cal.find('.flatpickr-clear').length < 1) {
                    $cal.append('<button type="button" class="flatpickr-clear" style="position: absolute; top: 0; right: 0; padding: 5px 10px; background: #ff6b6b; color: white; border: none; border-radius: 4px; margin: 5px;">Clear</button>');
                    $cal.find('.flatpickr-clear').on('click', function() {
                        instance.clear();
                        instance.close();
                    });
                }
            }
        });
        
        const withdrawEndDatePicker = flatpickr("#withdrawEndDate", {
            enableTime: true,
            dateFormat: "Y-m-d H:i",
            altFormat: "d-m-Y H:i",
            altInput: true,
            defaultDate: new Date(),
            time_12hr: true,
            minuteIncrement: 1,
            onReady: function(selectedDates, dateStr, instance) {
                var $cal = $(instance.calendarContainer);
                if ($cal.find('.flatpickr-clear').length < 1) {
                    $cal.append('<button type="button" class="flatpickr-clear" style="position: absolute; top: 0; right: 0; padding: 5px 10px; background: #ff6b6b; color: white; border: none; border-radius: 4px; margin: 5px;">Clear</button>');
                    $cal.find('.flatpickr-clear').on('click', function() {
                        instance.clear();
                        instance.close();
                    });
                }
            }
        });

        // Sample data
        var withdrawSampleData = [
            {
                withdrawCode: "CLT001",
                withdrawName: "John Enterprise",
                withdrawDateTime: "2025-10-15 09:30",
                withdrawAmount: "$5,250.00",
                withdrawUser: "Admin",
            },
            {
                withdrawCode: "CLT002",
                withdrawName: "Sarah Corp",
                withdrawDateTime: "2025-10-15 10:45",
                withdrawAmount: "$3,100.50",
                withdrawUser: "Manager",
            },
            {
                withdrawCode: "CLT003",
                withdrawName: "Mike Industries",
                withdrawDateTime: "2025-10-15 14:15",
                withdrawAmount: "$8,750.00",
                withdrawUser: "Agent",
            },
            {
                withdrawCode: "CLT001",
                withdrawName: "John Enterprise",
                withdrawDateTime: "2025-10-14 11:20",
                withdrawAmount: "$2,500.00",
                withdrawUser: "Admin",
            },
            {
                withdrawCode: "CLT004",
                withdrawName: "Emma Solutions",
                withdrawDateTime: "2025-10-14 15:30",
                withdrawAmount: "$1,250.75",
                withdrawUser: "Manager",
            },
            {
                withdrawCode: "CLT005",
                withdrawName: "David Tech",
                withdrawDateTime: "2025-10-13 08:00",
                withdrawAmount: "$6,325.00",
                withdrawUser: "Agent",
            },
            {
                withdrawCode: "CLT002",
                withdrawName: "Sarah Corp",
                withdrawDateTime: "2025-10-13 16:45",
                withdrawAmount: "$4,100.00",
                withdrawUser: "Admin",
            },
            {
                withdrawCode: "CLT006",
                withdrawName: "Lisa Holdings",
                withdrawDateTime: "2025-10-12 10:15",
                withdrawAmount: "$9,999.99",
                withdrawUser: "Manager",
            },
        ];

        var withdrawFilteredData = [...withdrawSampleData];

        // Initialize the page
        $(document).ready(function () {
            $("#withdrawClientCode").on("input", withdrawApplyFilters);
            $("#btn-withdraw-search").on("click", withdrawApplyFilters);
            $("#withdraw-btn-clear").on("click", withdrawClearFilters);
            $("#withdraw-btn-download").on("click", withdrawDownloadData);
            $("#withdraw-btn-request").on("click", withdraw_request_window);
            withdrawRenderTable();
        });

        function withdrawClearFilters() {
            $("#withdrawClientCode").val("");
            withdrawStartDatePicker.clear();
            withdrawEndDatePicker.clear();
            withdrawFilteredData = [...withdrawSampleData];
            withdrawRenderTable();
        }

        function withdrawDownloadData() {
            alert("Download functionality would be implemented here");
        }

        function withdrawRenderTable() {
            var $withdrawTbody = $("#withdrawTableBody");
            $withdrawTbody.empty();

            if (withdrawFilteredData.length === 0) {
                $withdrawTbody.append(`
                    <tr>
                        <td colspan="5" class="withdraw-empty-state">
                            <i class="fa fa-inbox" style="font-size: 48px; margin-bottom: 16px;"></i>
                            <p>No withdrawal records found</p>
                        </td>
                    </tr>
                `);
                return;
            }

            withdrawFilteredData.forEach((withdrawItem) => {
                // Format the date for display
                const dateObj = new Date(withdrawItem.withdrawDateTime.replace(' ', 'T'));
                const formattedDate = dateObj.toLocaleDateString() + ' ' + 
                    dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                
                var withdrawRow = `
                    <tr>
                        <td class="withdraw-td">${withdrawItem.withdrawCode}</td>
                        <td class="withdraw-td">${withdrawItem.withdrawName}</td>
                        <td class="withdraw-td">${formattedDate}</td>
                        <td class="withdraw-td withdraw-amount">${withdrawItem.withdrawAmount}</td>
                        <td class="withdraw-td">${withdrawItem.withdrawUser}</td>
                    </tr>
                `;
                $withdrawTbody.append(withdrawRow);
            });
        }

        function withdrawApplyFilters() {
            var withdrawClientCode = $("#withdrawClientCode").val().toLowerCase();
            var withdrawStartDate = $("#withdrawStartDate").val();
            var withdrawEndDate = $("#withdrawEndDate").val();

            console.log("Searching with:", {
                clientCode: withdrawClientCode,
                startDate: withdrawStartDate,
                endDate: withdrawEndDate
            });

            withdrawFilteredData = withdrawSampleData.filter((withdrawItem) => {
                var withdrawItemDate = withdrawItem.withdrawDateTime;
                var matchesClientCode = withdrawItem.withdrawCode.toLowerCase().includes(withdrawClientCode);
                
                // Date filtering with time
                var itemDateTime = new Date(withdrawItemDate.replace(' ', 'T'));
                var startDateTime = withdrawStartDate ? new Date(withdrawStartDate.replace(' ', 'T')) : null;
                var endDateTime = withdrawEndDate ? new Date(withdrawEndDate.replace(' ', 'T')) : null;
                
                var matchesStartDate = !startDateTime || itemDateTime >= startDateTime;
                var matchesEndDate = !endDateTime || itemDateTime <= endDateTime;
                
                return matchesClientCode && matchesStartDate && matchesEndDate;
            });

            console.log("Filtered results:", withdrawFilteredData.length);
            withdrawRenderTable();
        }

        function withdraw_request_window() {
            // In a real application, this would open a modal
            // For this example, we'll just show an alert
            alert("Withdraw Request modal would open here");
            
            // Example of how to open a modal if you have one:
            // $('#withdraw-request').modal('show');
        }

        function withdrawSubmitWithdrawRequest(event) {
            event.preventDefault();
            const form = event.target.closest('form');
      
            // Get all form values from the submitted form
            var withdrawClientCode = form.querySelector("#withdrawAbleClientCode").value;
            var withdrawName = form.querySelector("#withdrawName").value;
            var withdrawCurrentBalance = form.querySelector("#withdrawBalance").value;
            var withdrawAmount = form.querySelector("#withdrawAmount").value;
            var withdrawNarration = form.querySelector("#withdrawNarration").value;

            // Create new withdraw item
            var newWithdrawItem = {
                withdrawCode: withdrawClientCode,
                withdrawName: withdrawName,
                withdrawDateTime: new Date().toISOString().slice(0, 16).replace('T', ' '),
                withdrawAmount: `$${parseFloat(withdrawAmount || 0).toFixed(2)}`,
                withdrawUser: "You"
            };

            withdrawSampleData.unshift(newWithdrawItem);
            withdrawFilteredData = [...withdrawSampleData];
            withdrawRenderTable();

            // Close modal
            alert("Withdrawal request submitted successfully!");
            
            // Reset form
            form.reset();
        }
    </script>
</body>
</html>
