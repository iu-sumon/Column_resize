<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Interface</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0e17;
            --bg-secondary: #161b28;
            --bg-tertiary: #1e2433;
            --text-primary: #ffffff;
            --text-secondary: #8b93a7;
            --accent-yellow: #f0b90b;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --border-color: #2b3139;
        }

        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #ffffff;
            --bg-tertiary: #fafafa;
            --text-primary: #1e2433;
            --text-secondary: #5e6673;
            --border-color: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }

        .header {
            background: var(--bg-secondary);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: var(--accent-yellow);
        }

        .trade-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 12px 32px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-buy {
            background: var(--accent-green);
            color: white;
        }

        .btn-buy:hover {
            background: #0eb876;
        }

        .btn-sell {
            background: var(--accent-red);
            color: white;
        }

        .btn-sell:hover {
            background: #e5415a;
        }

        .theme-toggle {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .theme-toggle:hover {
            background: var(--border-color);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-secondary);
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            z-index: 1001;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 28px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .modal-body {
            padding: 28px;
        }

        .order-type {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .order-type-btn {
            flex: 1;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .order-type-btn.active {
            background: var(--accent-yellow);
            color: #000;
            border-color: var(--accent-yellow);
        }

        .margin-btn {
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 14px;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
            font-size: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .margin-btn:hover {
            border-color: var(--accent-yellow);
        }

        .margin-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .crypto-icon {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btc, .icon-usdt {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .icon-btc {
            background: #f7931a;
            color: white;
        }

        .icon-usdt {
            background: #26a17b;
            color: white;
        }

        .isolated-badge {
            background: var(--bg-primary);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .leverage-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .current-leverage {
            color: var(--accent-yellow);
            font-weight: 600;
        }

        .leverage-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 15px;
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        } 
        
        .street-container {
            position: relative;
            margin: 50px 0;
            padding: 0 20px;
        }
        
        .street-line {
            height: 1px;
            background: linear-gradient(90deg, #333 0%, #555 50%, #333 100%);
            border-radius: 2px;
            position: relative;
        }
        
        .rhombus-container {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            transform: translateY(-50%);
            display: flex;
            justify-content: space-between;
            padding: 0 10px;
        }
        
        .rhombus-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .rhombus {
            width: 10px;
            height: 10px;
            background: #020202;
            transform: rotate(45deg);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #666;
            margin-bottom: 8px;
            top: 14px;
        }
        
        .rhombus.active {
            background: var(--accent-yellow);
            border-color: var(--accent-yellow); 
        }
        
        .rhombus-value {
            color: #888;
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            position: relative;
            top: 10px;
        }
        
        .rhombus.active .rhombus-value {
            color: var(--accent-yellow); 
        }
        
        .selection-indicator {
            position: absolute;
            top: 50%;
            height: 2px;
            background: var(--accent-yellow);
            border-radius: 4px;
            transform: translateY(-50%);
            transition: all 0.4s ease;
            z-index: 1;
        } 
      
        .arrow {
            color: var(--text-secondary);
            font-size: 18px;
        }
 
        .borrow-info {
            background: var(--bg-tertiary);
            padding: 16px;
            border-radius: 6px;
            margin-bottom: 20px;
        }

        .borrow-text {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .borrow-amount {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .warning-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .warning-text a {
            color: var(--accent-yellow);
            text-decoration: none;
        }

        .modal-footer {
            display: flex;
            gap: 12px;
        }

        .btn-cancel {
            flex: 1;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }

        .btn-cancel:hover {
            background: var(--border-color);
        }

        .btn-confirm {
            flex: 1;
            background: var(--accent-yellow);
            color: #000;
            font-weight: 600;
        }

        .btn-confirm:hover {
            background: #f5c542;
        }

        .toggle-switch {
            position: relative;
            width: 48px;
            height: 26px;
            background: var(--bg-tertiary);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
            border: 1px solid var(--border-color);
        }

        .toggle-switch.active {
            background: var(--accent-yellow);
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: white;
            border-radius: 50%;
            transition: transform 0.3s;
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(22px);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <div class="logo">⚡ TradeX</div>
            <div class="trade-buttons">
                <button class="btn btn-buy" id="buyBtn">Buy</button>
                <button class="btn btn-sell" id="sellBtn">Sell</button>
            </div>
        </div>
        <button class="theme-toggle" id="themeToggle">🌓 Theme</button>
    </div>

    <!-- Order Window Modal -->
    <div class="modal-overlay" id="orderModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title" id="orderModalTitle">Buy BTC/USDT</h2>
                <button class="modal-close" id="closeOrderModal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="order-type">
                    <button class="order-type-btn active">Limit</button>
                    <button class="order-type-btn">Market</button>
                    <button class="order-type-btn">Stop</button>
                </div>

                <button class="margin-btn" id="marginBtn">
                    <div class="margin-info">
                        <div class="crypto-icon">
                            <div class="icon-btc">₿</div>
                            <div class="icon-usdt">₮</div>
                        </div>
                        <span>BTC/USDT</span>
                        <span class="isolated-badge">Isolated</span>
                    </div>
                    <span class="arrow">›</span>
                </button>

                <div class="leverage-control">
                    <div class="leverage-label">
                        <span>Leverage</span>
                        <span class="current-leverage">10x</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Margin Modal -->
    <div class="modal-overlay" id="marginModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">Adjust Max Leverage</h2>
                <button class="modal-close" id="closeMarginModal">&times;</button>
            </div>
            <div class="modal-body">
                <button class="margin-btn">
                    <div class="margin-info">
                        <div class="crypto-icon">
                            <div class="icon-btc">₿</div>
                            <div class="icon-usdt">₮</div>
                        </div>
                        <span>BTC/USDT</span>
                        <span class="isolated-badge">Isolated</span>
                    </div>
                    <div class="toggle-switch active">
                        <div class="toggle-slider"></div>
                    </div>
                </button>

                <div class="leverage-control">
                    <div class="leverage-label">
                        <span>Max Leverage</span>
                        <span class="current-leverage">Current: <span id="currentLeverage">10</span>x</span>
                    </div>

                    <input type="number" class="leverage-input" id="leverageInput" value="5" min="1" max="10">

                    <div class="container"> 
                        <div class="street-container">
                            <div class="street-line">
                                <div class="selection-indicator" id="selectionIndicator"></div>
                            </div>
                            <div class="rhombus-container">
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="1"></div>
                                    <span class="rhombus-value">1</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="2"></div>
                                    <span class="rhombus-value">2</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="3"></div>
                                    <span class="rhombus-value">3</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="4"></div>
                                    <span class="rhombus-value">4</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="5"></div>
                                    <span class="rhombus-value">5</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="6"></div>
                                    <span class="rhombus-value">6</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="7"></div>
                                    <span class="rhombus-value">7</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="8"></div>
                                    <span class="rhombus-value">8</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="9"></div>
                                    <span class="rhombus-value">9</span>
                                </div>
                                <div class="rhombus-wrapper">
                                    <div class="rhombus" data-value="10"></div>
                                    <span class="rhombus-value">10</span>
                                </div>
                            </div>
                        </div> 
                    </div>
                </div>

                <div class="borrow-info">
                    <div class="borrow-text">Max borrowing at current leverage:</div>
                    <div class="borrow-amount"><span id="borrowAmount">0 BTC or 0 USDT</span></div>
                </div>

                <div class="warning-text">
                    Lowering leverage does not necessarily mean a decrease in borrow limit. <a href="#">Learn more</a>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-cancel" id="cancelMarginBtn">Cancel</button>
                    <button class="btn btn-confirm" id="confirmMarginBtn">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            // Theme Toggle
            $('#themeToggle').click(function() {
                $('body').toggleClass('light-mode');
            });

            // Buy Button
            $('#buyBtn').click(function() {
                $('#orderModalTitle').text('Buy BTC/USDT');
                $('#orderModalOverlay').fadeIn(300);
            });

            // Sell Button
            $('#sellBtn').click(function() {
                $('#orderModalTitle').text('Sell BTC/USDT');
                $('#orderModalOverlay').fadeIn(300);
            });

            // Close Order Modal
            $('#closeOrderModal, #orderModalOverlay').click(function(e) {
                if (e.target === this) {
                    $('#orderModalOverlay').fadeOut(300);
                }
            });

            // Open Margin Modal
            $('#marginBtn').click(function() {
                $('#orderModalOverlay').fadeOut(300);
                setTimeout(function() {
                    $('#marginModalOverlay').fadeIn(300);
                }, 300);
            });

            // Close Margin Modal
            $('#closeMarginModal, #marginModalOverlay').click(function(e) {
                if (e.target === this) {
                    $('#marginModalOverlay').fadeOut(300);
                }
            });

            // Cancel Margin
            $('#cancelMarginBtn').click(function() {
                $('#marginModalOverlay').fadeOut(300);
            });

            // Confirm Margin
            $('#confirmMarginBtn').click(function() {
                const leverage = $('#leverageInput').val();
                $('#currentLeverage').text(leverage);
                $('#marginModalOverlay').fadeOut(300);
                $('#orderModalOverlay').fadeIn(300);
                $('.current-leverage').text(leverage + 'x');
            });

            // Order Type Toggle
            $('.order-type-btn').click(function() {
                $('.order-type-btn').removeClass('active');
                $(this).addClass('active');
            });

            // Leverage Input
            $('#leverageInput').on('input', function() {
                let value = $(this).val();
                if (value < 1) value = 1;
                if (value > 10) value = 10;
                $(this).val(value);
                updateLeverageMarks(value);
            });

            function updateLeverageMarks(value) {
                $('.rhombus').removeClass('active');
                $(`.rhombus[data-value="${value}"]`).addClass('active');
                
                // Update borrow amount
                $('#borrowAmount').text(`${value * 0.1} BTC or ${value * 1000} USDT`);
                
                // Update slider position
                updateSliderPosition(value);
            }

            // Toggle Switch
            $('.toggle-switch').click(function() {
                $(this).toggleClass('active');
            });

            // Rhombus slider functionality
            $('.rhombus').click(function() {
                const value = parseInt($(this).attr('data-value'));
                updateSelection(value);
                $('#leverageInput').val(value);
                updateLeverageMarks(value);
            });
            
            function updateSelection(selectedValue) {
                // Update all rhombuses
                $('.rhombus').each(function() {
                    const value = parseInt($(this).attr('data-value'));
                    
                    if (value <= selectedValue) {
                        $(this).addClass('active');
                        $(this).siblings('.rhombus-value').addClass('active');
                    } else {
                        $(this).removeClass('active');
                        $(this).siblings('.rhombus-value').removeClass('active');
                    }
                });
                
                // Update selection indicator
                updateSliderPosition(selectedValue);
            }
            
            function updateSliderPosition(selectedValue) {
                if (selectedValue > 0) {
                    const firstRhombus = $('.rhombus[data-value="1"]');
                    const selectedRhombus = $(`.rhombus[data-value="${selectedValue}"]`);
                    
                    const firstRect = firstRhombus[0].getBoundingClientRect();
                    const selectedRect = selectedRhombus[0].getBoundingClientRect();
                    
                    const width = selectedRect.left - firstRect.left + selectedRect.width;
                    
                    $('#selectionIndicator').css({
                        width: `${width}px`,
                        opacity: '1'
                    });
                } else {
                    $('#selectionIndicator').css('opacity', '0');
                }
            }

            // Initialize
            updateLeverageMarks(5);
        });
    </script>
</body>
</html>
