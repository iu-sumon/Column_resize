<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Leaderboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --card-bg: #1e293b;
            --header-bg: #1e293b;
            --table-header: #3730a3;
            --table-row-even: #1e293b;
            --table-row-odd: #1a2332;
            --border-color: #334155;
            --accent-color: #6366f1;
            --accent-hover: #818cf8;
            --positive: #10b981;
            --negative: #ef4444;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -2px rgba(0, 0, 0, 0.2);
            --radius: 12px;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        .light-theme {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --table-header: #4f46e5;
            --table-row-even: #f8fafc;
            --table-row-odd: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #4f46e5;
            --accent-hover: #4338ca;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
            line-height: 1.6;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .leaderboard-card {
            background-color: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .leaderboard-header {
            background-color: var(--header-bg);
            padding: 24px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .leaderboard-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .leaderboard-title i {
            color: var(--accent-color);
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .last-update {
            font-size: 14px;
            color: #94a3b8;
            background: rgba(30, 41, 59, 0.5);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 500;
        }

        .light-theme .last-update {
            background: #f1f5f9;
            color: #64748b;
        }

        .refresh-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .refresh-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(79, 70, 229, 0.3);
        }

        .refresh-btn:active {
            transform: translateY(0);
        }

        .refresh-btn i {
            transition: transform 0.5s ease;
        }

        .refresh-btn.refreshing i {
            transform: rotate(360deg);
        }

        .theme-toggle {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .theme-toggle:hover {
            background-color: var(--accent-color);
            color: white;
            transform: translateY(-2px);
        }

        .table-container {
            overflow-x: auto;
            padding: 0;
        }

        .leaderboard-table {
            width: 100%;
            border-collapse: collapse;
            margin: 0;
        }

        .leaderboard-table thead {
            background-color: var(--table-header);
        }

        .leaderboard-table thead th {
            padding: 18px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            color: white;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: none;
        }

        .leaderboard-table tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border-color);
        }

        .leaderboard-table tbody tr:nth-child(even) {
            background-color: var(--table-row-even);
        }

        .leaderboard-table tbody tr:nth-child(odd) {
            background-color: var(--table-row-odd);
        }

        .leaderboard-table tbody tr:hover {
            background-color: rgba(79, 70, 229, 0.05);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .leaderboard-table tbody td {
            padding: 16px 20px;
            font-weight: 500;
            border: none;
        }

        .rank-cell {
            font-weight: 700;
            text-align: center;
            width: 80px;
            position: relative;
        }

        .rank-1 {
            color: var(--gold);
            font-size: 18px;
        }

        .rank-2 {
            color: var(--silver);
            font-size: 17px;
        }

        .rank-3 {
            color: var(--bronze);
            font-size: 16px;
        }

        .rank-other {
            color: var(--accent-color);
        }

        .achievement-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .rank-1 .achievement-icon {
            color: var(--gold);
        }

        .rank-2 .achievement-icon {
            color: var(--silver);
        }

        .rank-3 .achievement-icon {
            color: var(--bronze);
        }

        .client-code {
            font-weight: 600;
            color: var(--accent-color);
        }

        .name-cell {
            font-weight: 500;
        }

        .cash-cell {
            font-weight: 600;
        }

        .ry-cell {
            font-weight: 700;
            text-align: right;
        }

        .ry-positive {
            color: var(--positive);
        }

        .ry-negative {
            color: var(--negative);
        }

        .table-footer {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            font-size: 14px;
            color: #94a3b8;
        }

        .light-theme .table-footer {
            color: #64748b;
        }

        .pagination {
            display: flex;
            gap: 8px;
        }

        .page-btn {
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-btn.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .page-btn:hover:not(.active) {
            background-color: var(--accent-color);
            color: white;
        }

        .top-performers {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .top-performer-card {
            background: linear-gradient(145deg, var(--card-bg), var(--table-row-odd));
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
            width: 200px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: transform 0.3s ease;
        }

        .top-performer-card:hover {
            transform: translateY(-5px);
        }

        .top-performer-card.rank-1 {
            border-top: 4px solid var(--gold);
        }

        .top-performer-card.rank-2 {
            border-top: 4px solid var(--silver);
        }

        .top-performer-card.rank-3 {
            border-top: 4px solid var(--bronze);
        }

        .top-performer-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: white;
        }

        .top-performer-card.rank-1 .top-performer-avatar {
            background: linear-gradient(135deg, var(--gold), #ffed4e);
        }

        .top-performer-card.rank-2 .top-performer-avatar {
            background: linear-gradient(135deg, var(--silver), #e8e8e8);
        }

        .top-performer-card.rank-3 .top-performer-avatar {
            background: linear-gradient(135deg, var(--bronze), #e6a756);
        }

        .top-performer-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .top-performer-ry {
            font-weight: 700;
            font-size: 18px;
        }

        @media (max-width: 768px) {
            .leaderboard-header {
                padding: 20px;
                flex-direction: column;
                align-items: flex-start;
            }
            
            .header-controls {
                width: 100%;
                justify-content: space-between;
            }
            
            .leaderboard-table thead th,
            .leaderboard-table tbody td {
                padding: 14px 12px;
            }
            
            .top-performers {
                gap: 10px;
            }
            
            .top-performer-card {
                width: calc(33.333% - 10px);
                min-width: 150px;
            }
        }

        @media (max-width: 576px) {
            body {
                padding: 10px;
            }
            
            .leaderboard-title {
                font-size: 20px;
            }
            
            .header-controls {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
            
            .refresh-btn {
                width: 100%;
                justify-content: center;
            }
            
            .top-performer-card {
                width: 100%;
            }
        }
    </style>
</head>
<body class="dark-theme">
    <div class="container">
        <div class="leaderboard-card">
            <div class="leaderboard-header">
                <div class="leaderboard-title">
                    <i class="fas fa-trophy"></i>
                    Client Leaderboard
                </div>
                <div class="header-controls">
                    <div class="last-update">
                        <i class="far fa-clock"></i>
                        Last updated: <span id="lastUpdateTime">Just now</span>
                    </div>
                    <button id="refreshBtn" class="refresh-btn">
                        <i class="fas fa-sync-alt"></i> Refresh Data
                    </button>
                    <div class="theme-toggle" id="themeToggle">
                        <i class="fas fa-sun"></i>
                    </div>
                </div>
            </div>
            
            <!-- Top Performers Section -->
            <div class="top-performers" id="topPerformers">
                <!-- Top 3 performers will be populated here -->
            </div>
            
            <div class="table-container">
                <table class="leaderboard-table">
                    <thead>
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Client Code</th>
                            <th scope="col">Name</th>
                            <th scope="col">Total Cash</th>
                            <th scope="col">Current Cash</th>
                            <th scope="col">Market Value</th>
                            <th scope="col">RY</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboardTable">
                        <!-- Data will be populated by JavaScript -->
                    </tbody>
                </table>
            </div>
            
            <div class="table-footer">
                <div>Showing <strong>8</strong> of <strong>8</strong> clients</div>
                <div class="pagination">
                    <div class="page-btn active">1</div>
                    <div class="page-btn">2</div>
                    <div class="page-btn">3</div>
                    <div class="page-btn"><i class="fas fa-chevron-right"></i></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function() {
            // Sample data for the leaderboard
            const sampleData = [
                { clientCode: "CL001", name: "John Smith", totalCash: 125000, currentCash: 45000, marketValue: 80000, ry: 12.5 },
                { clientCode: "CL002", name: "Emma Johnson", totalCash: 98000, currentCash: 32000, marketValue: 66000, ry: 8.3 },
                { clientCode: "CL003", name: "Michael Brown", totalCash: 156000, currentCash: 52000, marketValue: 104000, ry: 15.7 },
                { clientCode: "CL004", name: "Sarah Davis", totalCash: 87000, currentCash: 28000, marketValue: 59000, ry: 5.2 },
                { clientCode: "CL005", name: "Robert Wilson", totalCash: 142000, currentCash: 48000, marketValue: 94000, ry: 11.8 },
                { clientCode: "CL006", name: "Jennifer Miller", totalCash: 110000, currentCash: 38000, marketValue: 72000, ry: 9.6 },
                { clientCode: "CL007", name: "William Taylor", totalCash: 135000, currentCash: 42000, marketValue: 93000, ry: 13.4 },
                { clientCode: "CL008", name: "Linda Anderson", totalCash: 95000, currentCash: 31000, marketValue: 64000, ry: 7.1 }
            ];

            // Function to populate the top performers section
            function populateTopPerformers(data) {
                const topPerformersContainer = $('#topPerformers');
                topPerformersContainer.empty();
                
                // Get top 3 performers
                const top3 = data.slice(0, 3);
                
                top3.forEach((item, index) => {
                    const rankClass = `rank-${index + 1}`;
                    const ryClass = item.ry >= 0 ? 'ry-positive' : 'ry-negative';
                    const rySign = item.ry >= 0 ? '+' : '';
                    const initials = item.name.split(' ').map(n => n[0]).join('');
                    
                    const card = `
                        <div class="top-performer-card ${rankClass}">
                            <div class="top-performer-avatar">${initials}</div>
                            <div class="top-performer-name">${item.name}</div>
                            <div class="top-performer-ry ${ryClass}">${rySign}${item.ry}%</div>
                            <div class="top-performer-code">${item.clientCode}</div>
                        </div>
                    `;
                    topPerformersContainer.append(card);
                });
            }

            // Function to populate the table
            function populateTable(data) {
                const tableBody = $('#leaderboardTable');
                tableBody.empty();
                
                data.forEach((item, index) => {
                    const rank = index + 1;
                    let rankClass = 'rank-other';
                    let achievementIcon = '';
                    
                    if (rank === 1) {
                        rankClass = 'rank-1';
                        achievementIcon = '<i class="fas fa-crown achievement-icon"></i>';
                    } else if (rank === 2) {
                        rankClass = 'rank-2';
                        achievementIcon = '<i class="fas fa-medal achievement-icon"></i>';
                    } else if (rank === 3) {
                        rankClass = 'rank-3';
                        achievementIcon = '<i class="fas fa-award achievement-icon"></i>';
                    }
                    
                    const ryClass = item.ry >= 0 ? 'ry-positive' : 'ry-negative';
                    const rySign = item.ry >= 0 ? '+' : '';
                    
                    const row = `
                        <tr>
                            <td class="rank-cell ${rankClass}">
                                ${achievementIcon}
                                ${rank}
                            </td>
                            <td class="client-code">${item.clientCode}</td>
                            <td class="name-cell">${item.name}</td>
                            <td class="cash-cell">$${item.totalCash.toLocaleString()}</td>
                            <td class="cash-cell">$${item.currentCash.toLocaleString()}</td>
                            <td class="cash-cell">$${item.marketValue.toLocaleString()}</td>
                            <td class="ry-cell ${ryClass}">${rySign}${item.ry}%</td>
                        </tr>
                    `;
                    tableBody.append(row);
                });
            }

            // Initial table and top performers population
            populateTopPerformers(sampleData);
            populateTable(sampleData);

            // Theme toggle functionality
            $('#themeToggle').click(function() {
                $('body').toggleClass('light-theme');
                const icon = $(this).find('i');
                if ($('body').hasClass('light-theme')) {
                    icon.removeClass('fa-sun').addClass('fa-moon');
                } else {
                    icon.removeClass('fa-moon').addClass('fa-sun');
                }
            });

            // Refresh button functionality
            $('#refreshBtn').click(function() {
                const btn = $(this);
                const icon = btn.find('i');
                
                // Add refreshing animation
                btn.addClass('refreshing');
                
                // Simulate API call delay
                setTimeout(() => {
                    // Update last update time
                    const now = new Date();
                    const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    $('#lastUpdateTime').text(timeString);
                    
                    // Remove refreshing animation
                    setTimeout(() => {
                        btn.removeClass('refreshing');
                    }, 500);
                    
                    // Show refresh confirmation
                    btn.css('background-color', '#10b981');
                    setTimeout(() => {
                        btn.css('background-color', '');
                    }, 1000);
                }, 1000);
            });

            // Simulate periodic updates
            setInterval(() => {
                // In a real application, this would fetch new data from an API
                // For demo purposes, we'll just update the time
                const now = new Date();
                const timeString = now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                $('#lastUpdateTime').text(timeString);
            }, 30000); // Update every 30 seconds

            // Pagination buttons
            $('.page-btn').click(function() {
                $('.page-btn').removeClass('active');
                $(this).addClass('active');
            });
        });
    </script>
</body>
</html>
