<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Market Depth — Smooth Bid/Ask Gradient</title>
<style>
  :root{
    --table-width: 900px;
    --col-count: 8;
    --gap: 0; /* divider width between BID and ASK halves */
  }

  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f1114;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color:#fff;
  }

  .market-table {
    width: var(--table-width);
    border-collapse: collapse;
    overflow: hidden;
    border-radius:6px;
    box-shadow:0 6px 18px rgba(0,0,0,0.6);
    /* TWO full-height vertical gradients: left = BID (blue), right = ASK (red) */
    background-image:
      linear-gradient(to bottom, #15325a 0%, #1f64b6 100%), /* left */
      linear-gradient(to bottom, #9b2f2f 0%, #291010 100%); /* right */
    /* place first gradient on left half, second on right half */
    background-size: 50% 100%, 50% 100%;
    background-position: left top, right top;
    background-repeat: no-repeat;
    /* dark subtle border between halves */
    position: relative;
  }

  /* header row styling (separate solid dark bar atop gradients) */
  .market-table thead tr {
    background: rgba(28,30,36,0.95);
    color: #bfc8d6;
    font-weight:600;
    font-size:13px;
    border-bottom:1px solid rgba(255,255,255,0.04);
  }

  th, td {
    padding: 10px 12px;
    text-align: center;
    font-size:14px;
    white-space:nowrap;
  }

  /* make cells transparent so table's background gradients show through */
  tbody td {
    background: transparent;
    border-bottom: 1px solid rgba(0,0,0,0.25); /* subtle row separators */
    color: rgba(255,255,255,0.92);
  }

  /* ensure left and right halves align visually:
     We'll place a thin vertical divider between the 4th and 5th column */
  .divider {
    position: absolute;
    top: 42px; /* height of header row (approx) */
    bottom: 0;
    width: 4px;
    left: calc(50% - 2px); /* center divider at 50% */
    background: linear-gradient(to bottom, rgba(0,0,0,0.45), rgba(0,0,0,0.15));
    pointer-events: none;
  }

  /* optional subtle hover highlight that respects gradient (increase brightness) */
  tbody tr:hover td{
    filter: brightness(1.06);
    transition: filter .15s;
  }

  /* column sizing similar to your screenshot */
  .market-table colgroup col:nth-child(1){ width:7%; }  /* Ordr */
  .market-table colgroup col:nth-child(2){ width:11%; } /* CUM Q */
  .market-table colgroup col:nth-child(3){ width:11%; } /* BID Q */
  .market-table colgroup col:nth-child(4){ width:12%; } /* BID */
  .market-table colgroup col:nth-child(5){ width:12%; } /* ASK */
  .market-table colgroup col:nth-child(6){ width:11%; } /* ASK Q */
  .market-table colgroup col:nth-child(7){ width:20%; } /* CUM Q (right) */
  .market-table colgroup col:nth-child(8){ width:16%; } /* Ordr (right) */

  /* make header text left-aligned for first columns like screenshot feel */
  thead th:first-child,
  thead th:nth-child(2),
  thead th:nth-child(3),
  thead th:nth-child(4) {
    text-align: left;
    padding-left:14px;
  }

  /* small responsive tweak */
  @media (max-width:980px){
    :root { --table-width: 92vw; }
    th, td { padding:8px 10px; font-size:13px; }
  }
</style>
</head>
