<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Ledger Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
  :root{
    --page-bg:#0b0d12;
    --card-bg:#181a20;
    --row-line:#2a2c34;
    --head-text:#aab0bf;
    --cell-text:#d9dce4;
    --shadow:0 20px 40px -20px rgba(0,0,0,.55);
    --font:'Segoe UI', Roboto, -apple-system, Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"]{
    --page-bg:#eef1f6;
    --card-bg:#ffffff;
    --row-line:#e7eaf1;
    --head-text:#6b7280;
    --cell-text:#2c3140;
    --shadow:0 16px 34px -20px rgba(30,40,70,.2);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    font-family:var(--font);
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:background .3s ease;
  }

  .toolbar{
    width:100%;
    max-width:1160px;
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .theme-toggle{
    display:flex;align-items:center;gap:8px;
    background:transparent;border:1px solid var(--row-line);color:var(--head-text);
    padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12.5px;
    font-family:var(--font);
  }
  .theme-toggle svg{width:14px;height:14px;}
  .theme-toggle:hover{border-color:#4c8dff;color:var(--cell-text);}

  .table-card{
    width:100%;
    max-width:1160px;
    background:var(--card-bg);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .scroll{overflow-x:auto;}
  table{
    border-collapse:collapse;
    width:100%;
    min-width:960px;
  }

  thead th{
    font-weight:400;
    font-size:14px;
    color:var(--head-text);
    padding:20px 18px;
    text-align:center;
    white-space:nowrap;
  }

  tbody td{
    padding:16px 18px;
    font-size:14.5px;
    color:var(--cell-text);
    text-align:center;
    white-space:nowrap;
    border-top:1px solid var(--row-line);
  }

  tbody tr:hover td{
    background:rgba(255,255,255,0.015);
  }
  html[data-theme="light"] tbody tr:hover td{
    background:rgba(0,0,0,0.015);
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button class="theme-toggle" id="themeToggle">
      <svg id="toggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      <span id="toggleLabel">Dark mode</span>
    </button>
  </div>

  <div class="table-card">
    <div class="scroll">
      <table id="ledgerTable">
        <thead>
          <tr>
            <th>Date</th>
            <th>Type</th>
            <th>Tran. Type</th>
            <th>Details</th>
            <th>QTY</th>
            <th>Rate</th>
            <th>Amount</th>
            <th>Comm.</th>
            <th>Balance</th>
            <th>Closing</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

<script>
$(function(){

  var raw = [
    { date:"19/08/24", type:"Credit", tranType:"Buy",     details:"Received",   qty:0,   rate:0.00,  amount:26310.00, comm:0.00,  balance:26310.00,  closing:0.00 },
    { date:"04/09/24", type:"Debit",  tranType:"Buy",     details:"SPCERAMICS", qty:543, rate:18.40, amount:9991.20,  comm:19.98, balance:-10011.18, closing:-10003.68 },
    { date:"04/09/24", type:"Credit", tranType:"Receive", details:"Received",   qty:0,   rate:0.00,  amount:10012.00, comm:0.00,  balance:10012.00,  closing:8.32 },
    { date:"28/10/24", type:"Debit",  tranType:"Buy",     details:"PTL",        qty:233, rate:42.65, amount:9936.30,  comm:19.98, balance:-9956.17,  closing:-9947.86 },
    { date:"19/08/24", type:"Credit", tranType:"Buy",     details:"Received",   qty:0,   rate:0.00,  amount:26310.00, comm:0.00,  balance:26310.00,  closing:0.00 },
    { date:"04/09/24", type:"Debit",  tranType:"Buy",     details:"SPCERAMICS", qty:543, rate:18.40, amount:9991.20,  comm:19.98, balance:-10011.18, closing:-10003.68 },
    { date:"04/10/24", type:"Credit", tranType:"Buy",     details:"Received",   qty:0,   rate:0.00,  amount:26310.00, comm:0.00,  balance:26310.00,  closing:0.00 },
    { date:"28/10/24", type:"Debit",  tranType:"Buy",     details:"SPCERAMICS", qty:543, rate:18.40, amount:9991.20,  comm:19.98, balance:-10011.18, closing:-10003.68 }
  ];

  var fmt = function(n){
    var sign = n < 0 ? '-' : '';
    return sign + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
  };
  var fmtInt = function(n){ return Number(n).toLocaleString('en-US'); };

  function render(){
    var $body = $('#tableBody').empty();
    raw.forEach(function(r){
      $body.append(
        '<tr>' +
          '<td>'+r.date+'</td>' +
          '<td>'+r.type+'</td>' +
          '<td>'+r.tranType+'</td>' +
          '<td>'+r.details+'</td>' +
          '<td>'+fmtInt(r.qty)+'</td>' +
          '<td>'+fmt(r.rate)+'</td>' +
          '<td>'+fmt(r.amount)+'</td>' +
          '<td>'+fmt(r.comm)+'</td>' +
          '<td>'+fmt(r.balance)+'</td>' +
          '<td>'+fmt(r.closing)+'</td>' +
        '</tr>'
      );
    });
  }
  render();

  /* theme toggle */
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = prefersDark ? 'dark' : 'light';

  function applyTheme(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    $('#toggleLabel').text(t === 'dark' ? 'Dark mode' : 'Light mode');
    $('#toggleIcon').html(
      t === 'dark'
        ? '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    );
  }
  applyTheme(theme);

  $('#themeToggle').on('click', function(){
    applyTheme(theme === 'dark' ? 'light' : 'dark');
  });

});
</script>
</body>
</html>
