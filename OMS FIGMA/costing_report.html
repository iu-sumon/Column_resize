<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Costing Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<style>
  :root{
    --page-bg:#0b0d12;
    --card-bg:#18191f;
    --date-bg:#212329;
    --row-line:#2b2d35;
    --head-text:#aab0bf;
    --cell-text:#d7dae2;
    --date-text:#c7cbd6;
    --total-text:#4c8dff;
    --shadow:0 20px 40px -20px rgba(0,0,0,.55);
    --font:'Segoe UI', Roboto, -apple-system, Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"]{
    --page-bg:#eef1f6;
    --card-bg:#ffffff;
    --date-bg:#f2f4f8;
    --row-line:#e7eaf1;
    --head-text:#6b7280;
    --cell-text:#2c3140;
    --date-text:#3a4152;
    --total-text:#2f6be0;
    --shadow:0 16px 34px -20px rgba(30,40,70,.2);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--page-bg);
    font-family:var(--font);
    padding:40px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    transition:background .3s ease;
  }

  .toolbar{
    width:100%;
    max-width:900px;
    display:flex;
    justify-content:flex-end;
    margin-bottom:14px;
  }
  .theme-toggle{
    display:flex;align-items:center;gap:8px;
    background:transparent;border:1px solid var(--row-line);color:var(--head-text);
    padding:6px 12px;border-radius:20px;cursor:pointer;font-size:12.5px;
    font-family:var(--font);
  }
  .theme-toggle svg{width:14px;height:14px;}
  .theme-toggle:hover{border-color:var(--total-text);color:var(--cell-text);}

  .table-card{
    width:100%;
    max-width:900px;
    background:var(--card-bg);
    border-radius:18px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }

  .scroll{overflow-x:auto;}
  table{
    border-collapse:collapse;
    width:100%;
    min-width:720px;
  }

  thead th{
    font-weight:400;
    font-size:14px;
    color:var(--head-text);
    padding:20px 22px;
    text-align:center;
    white-space:nowrap;
  }
  thead th.col-date{
    text-align:left;
    background:var(--date-bg);
    border-top-left-radius:18px;
  }

  tbody td{
    padding:16px 22px;
    font-size:14.5px;
    color:var(--cell-text);
    text-align:center;
    white-space:nowrap;
    border-top:1px solid var(--row-line);
  }
  tbody td.col-date{
    text-align:left;
    color:var(--date-text);
    background:var(--date-bg);
  }
  tbody tr:last-child td.col-date{
    border-bottom-left-radius:18px;
  }

  tfoot td{
    padding:22px;
    font-size:16px;
    font-weight:600;
    color:var(--total-text);
    text-align:center;
    border-top:1px solid var(--row-line);
  }
  tfoot td.col-date{
    background:var(--date-bg);
    border-bottom-left-radius:18px;
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button class="theme-toggle" id="themeToggle">
      <svg id="toggleIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      <span id="toggleLabel">Dark mode</span>
    </button>
  </div>

  <div class="table-card">
    <div class="scroll">
      <table id="costingTable">
        <thead>
          <tr>
            <th class="col-date">Date</th>
            <th>Type</th>
            <th>Trade Qty</th>
            <th>Rate (TK.)</th>
            <th>Commission</th>
            <th>Avg Qty</th>
            <th>Avg Cost</th>
            <th>Total Cost</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
        <tfoot id="tableFoot"></tfoot>
      </table>
    </div>
  </div>

<script>
$(function(){

  var raw = [
    { date:"Aug 19, 24", type:"B", tradeQty:1000, rate:21.00, commission:42.00, avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Aug 19, 24", type:"B", tradeQty:250,  rate:21.00, commission:10.50, avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Nov 10, 24", type:"B", tradeQty:250,  rate:12.00, commission:6.35,  avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Nov 10, 24", type:"B", tradeQty:250,  rate:12.00, commission:6.35,  avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Nov 11, 24", type:"B", tradeQty:300,  rate:12.00, commission:7.38,  avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Nov 19, 24", type:"B", tradeQty:300,  rate:11.00, commission:7.14,  avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Nov 21, 24", type:"B", tradeQty:285,  rate:11.00, commission:6.44,  avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Nov 21, 24", type:"B", tradeQty:215,  rate:11.00, commission:4.86,  avgQty:1000.00, avgCost:21.04, totalCost:21042.00 },
    { date:"Jan 12, 24", type:"B", tradeQty:459,  rate:12.00, commission:11.38, avgQty:1000.00, avgCost:21.04, totalCost:21042.00 }
  ];

  var fmt = function(n){ return Number(n).toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 }); };
  var fmtInt = function(n){ return Number(n).toLocaleString('en-US'); };

  function render(){
    var $body = $('#tableBody').empty();
    var $foot = $('#tableFoot').empty();

    raw.forEach(function(r){
      $body.append(
        '<tr>' +
          '<td class="col-date">'+r.date+'</td>' +
          '<td>'+r.type+'</td>' +
          '<td>'+fmtInt(r.tradeQty)+'</td>' +
          '<td>'+fmt(r.rate)+'</td>' +
          '<td>'+fmt(r.commission)+'</td>' +
          '<td>'+fmt(r.avgQty)+'</td>' +
          '<td>'+fmt(r.avgCost)+'</td>' +
          '<td>'+fmt(r.totalCost)+'</td>' +
        '</tr>'
      );
    });

    var t = raw.reduce(function(a,r){
      a.tradeQty += r.tradeQty;
      a.commission += r.commission;
      return a;
    }, { tradeQty:0, commission:0 });

    $foot.append(
      '<tr>' +
        '<td class="col-date"></td>' +
        '<td></td>' +
        '<td>'+fmtInt(t.tradeQty)+'</td>' +
        '<td></td>' +
        '<td>'+fmt(t.commission)+'</td>' +
        '<td></td>' +
        '<td></td>' +
        '<td></td>' +
      '</tr>'
    );
  }
  render();

  /* theme toggle */
  var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  var theme = prefersDark ? 'dark' : 'light';

  function applyTheme(t){
    theme = t;
    document.documentElement.setAttribute('data-theme', t);
    $('#toggleLabel').text(t === 'dark' ? 'Dark mode' : 'Light mode');
    $('#toggleIcon').html(
      t === 'dark'
        ? '<path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/>'
        : '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    );
  }
  applyTheme(theme);

  $('#themeToggle').on('click', function(){
    applyTheme(theme === 'dark' ? 'light' : 'dark');
  });

});
</script>
</body>
</html>
