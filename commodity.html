<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trading Panels — Modern Commodity Trading Interface</title>
  <meta name="description" content="Advanced commodity trading panel with dynamic theme switching" />
  <style>
    /* =========================================
       LIGHT THEME (Default)
       ========================================= */
    :root,
    :root[data-theme="light"] {
      --bg: #f8fafc;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      --card: #ffffff;
      --card-hover: #fafbfc;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-2: #0891b2;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --success: #16a34a;
      --warning: #f59e0b;
      --glass: rgba(255,255,255,0.8);
      --shadow: 0 4px 24px rgba(0,0,0,0.06);
      --shadow-hover: 0 8px 32px rgba(0,0,0,0.1);
      --radius: 16px;
      --input-border: #e2e8f0;
      --input-focus: #cbd5e1;
      --control-bg: #f1f5f9;
      --text: #0f172a;
      --text-secondary: #475569;
    }

    /* =========================================
       DARK THEME
       ========================================= */
    :root[data-theme="dark"] {
      --bg: #0a0e1a;
      --bg-gradient: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      --card: #111827;
      --card-hover: #1a2030;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-2: #06b6d4;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #22c55e;
      --warning: #fbbf24;
      --glass: rgba(255,255,255,0.05);
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-hover: 0 12px 48px rgba(0,0,0,0.6);
      --radius: 16px;
      --input-border: #1f2937;
      --input-focus: #374151;
      --control-bg: #1f2937;
      --text: #f1f5f9;
      --text-secondary: #cbd5e1;
    }

    /* =========================================
       BASE STYLES
       ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 24px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s ease;
    }

    /* =========================================
       LAYOUT
       ========================================= */
    .frame {
      width: 100%;
      max-width: 1200px;
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid var(--input-border);
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
    }

    /* =========================================
       TABS
       ========================================= */
    .tabs {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 24px;
      padding: 6px;
      background: var(--control-bg);
      border-radius: 12px;
    }

    .tab {
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--muted);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .tab:hover {
      color: var(--text);
      background: var(--glass);
    }

    .tab.active {
      background: var(--card);
      color: var(--accent);
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    /* =========================================
       FORMS
       ========================================= */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    select, input {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid var(--input-border);
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    select:hover, input:hover {
      border-color: var(--input-focus);
    }

    select:focus, input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      opacity: 1;
    }

    /* =========================================
       INFO ROW
       ========================================= */
    .info-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: var(--control-bg);
      border: 1px solid var(--input-border);
    }

    .info-box {
      flex: 1;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }

    .info-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .info-col .label {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .large {
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
    }

    /* =========================================
       BUTTONS
       ========================================= */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s ease;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-hover);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.buy {
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      color: white;
    }

    .btn.buy:hover {
      background: linear-gradient(135deg, var(--accent-hover), var(--accent));
    }

    .btn.sell {
      background: linear-gradient(135deg, var(--danger), var(--danger-hover));
      color: white;
    }

    .btn.sell:hover {
      background: linear-gradient(135deg, var(--danger-hover), var(--danger));
    }

    .btn.ghost {
      background: transparent;
      border: 2px solid var(--input-border);
      color: var(--muted);
    }

    .btn.ghost:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: var(--glass);
    }

    /* =========================================
       SPREAD SPECIFIC
       ========================================= */
    .spread-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .leg {
      padding: 18px;
      border-radius: 12px;
      border: 2px solid var(--input-border);
      background: var(--control-bg);
      transition: all 0.2s ease;
    }

    .leg:hover {
      border-color: var(--accent);
    }

    .leg .title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* =========================================
       SIDE CARD
       ========================================= */
    .side-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mini {
      padding: 20px;
      border-radius: var(--radius);
      background: var(--card);
      box-shadow: var(--shadow);
      border: 1px solid var(--input-border);
      transition: all 0.3s ease;
    }

    .mini:hover {
      box-shadow: var(--shadow-hover);
    }

    .summary {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-top: 12px;
    }

    .pill {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      background: var(--control-bg);
      border: 1px solid var(--input-border);
    }

    /* =========================================
       THEME TOGGLE
       ========================================= */
    #themeToggle {
      position: fixed;
      top: 24px;
      right: 24px;
      padding: 10px 20px;
      border-radius: 12px;
      border: 2px solid var(--input-border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      z-index: 999;
      box-shadow: var(--shadow);
      transition: all 0.2s ease;
    }

    #themeToggle:hover {
      transform: scale(1.05);
      box-shadow: var(--shadow-hover);
      border-color: var(--accent);
    }

    /* =========================================
       UTILITY CLASSES
       ========================================= */
    .muted {
      color: var(--muted);
      font-size: 12px;
    }

    .small {
      font-size: 13px;
    }

    .success {
      color: var(--success);
      font-weight: 600;
    }

    .danger {
      color: var(--danger);
      font-weight: 600;
    }

    /* =========================================
       RESPONSIVE
       ========================================= */
    @media (max-width: 1024px) {
      .frame {
        grid-template-columns: 1fr;
      }
      
      body {
        padding: 24px 16px;
      }
    }

    @media (max-width: 640px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
      
      .spread-grid {
        grid-template-columns: 1fr;
      }
      
      .card {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <!-- Theme Toggle Button -->
  <button id="themeToggle">🌓 Theme</button>

  <div class="frame">
    <!-- LEFT: Tabbed big card -->
    <div class="card">
      <div class="tabs" role="tablist">
        <button class="tab active" data-panel="commodity">Commodity Order</button>
        <button class="tab" data-panel="spread">Spread Order</button>
        <button class="tab" data-panel="advanced">Advanced Options</button>
      </div>

      <div class="content">
        <!-- COMMODITY PANEL -->
        <div class="panel" id="commodity">
          <div class="grid-2">
            <div class="form-row">
              <label>Commodity</label>
              <select id="com_commodity">
                <option>GOLD</option>
                <option>SILVER</option>
                <option>CRUDE OIL</option>
                <option>NATURAL GAS</option>
              </select>
            </div>
            <div class="form-row">
              <label>Expiry</label>
              <select id="com_expiry">
                <option>Feb 2026</option>
                <option>Apr 2026</option>
                <option>Jun 2026</option>
              </select>
            </div>

            <div class="form-row">
              <label>Type</label>
              <select id="com_type">
                <option>FUTURES</option>
                <option>OPTIONS</option>
              </select>
            </div>

            <div class="form-row">
              <label>Order Type</label>
              <select id="com_ordertype">
                <option>Limit</option>
                <option>Market</option>
                <option>Stop Loss</option>
              </select>
            </div>

            <div class="form-row">
              <label>Qty (Lots)</label>
              <input id="com_qty" type="number" min="1" value="5" />
            </div>

            <div class="form-row">
              <label>Price</label>
              <input id="com_price" type="number" value="72450.00" step="0.01" />
            </div>

            <div class="form-row">
              <label>Product</label>
              <select id="com_product">
                <option>Carry Forward</option>
                <option>Intraday</option>
              </select>
            </div>

            <div class="form-row">
              <label>Validity</label>
              <select id="com_validity">
                <option>DAY</option>
                <option>IOC</option>
                <option>GTD</option>
              </select>
            </div>
          </div>

          <div class="info-row">
            <div class="info-box">
              <div class="info-col">
                <span class="label">Margin Req</span>
                <span class="large" id="margin_req">-</span>
              </div>
              <div class="info-col">
                <span class="label">Available</span>
                <span class="large" id="avail_bal">-</span>
              </div>
              <div class="info-col">
                <span class="label">MTM</span>
                <span class="large" id="mtm">-</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn buy" id="com_buy">Buy</button>
            <button class="btn sell" id="com_sell">Sell</button>
            <button class="btn ghost" id="com_reset">Reset</button>
          </div>
        </div>

        <!-- SPREAD PANEL -->
        <div class="panel" id="spread" style="display:none">
          <div class="spread-grid">
            <div class="leg">
              <div class="title">Buy Leg</div>
              <div class="form-row">
                <label>Commodity</label>
                <select><option>GOLD</option><option>SILVER</option></select>
              </div>
              <div class="form-row">
                <label>Expiry</label>
                <select><option>Feb 2026</option><option>Apr 2026</option></select>
              </div>
              <div class="form-row">
                <label>Quantity</label>
                <input type="number" value="10" />
              </div>
              <div class="form-row">
                <label>Product</label>
                <select><option>Carry Forward</option><option>Intraday</option></select>
              </div>
            </div>

            <div class="leg">
              <div class="title">Sell Leg</div>
              <div class="form-row">
                <label>Commodity</label>
                <select><option>GOLD</option><option>SILVER</option></select>
              </div>
              <div class="form-row">
                <label>Expiry</label>
                <select><option>Apr 2026</option><option>Jun 2026</option></select>
              </div>
              <div class="form-row">
                <label>Price</label>
                <input type="number" value="72500" />
              </div>
              <div class="form-row">
                <label>Validity</label>
                <select><option>Day</option><option>IOC</option></select>
              </div>
            </div>
          </div>

          <div class="info-row" style="margin-top:20px">
            <div class="info-box">
              <div class="info-col">
                <span class="label">Margin</span>
                <span class="large" id="spr_margin">1,20,000</span>
              </div>
              <div class="info-col">
                <span class="label">Open Pos</span>
                <span class="small">5 Buy @ 72,400</span>
              </div>
              <div class="info-col">
                <span class="label">Unrealized P/L</span>
                <span class="small success">+2,500</span>
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn buy">Execute Spread</button>
            <button class="btn ghost" id="spr_reset">Reset</button>
          </div>
        </div>

        <!-- ADVANCED PANEL -->
        <div class="panel" id="advanced" style="display:none">
          <div class="grid-2">
            <div class="form-row">
              <label>Order Type</label>
              <select>
                <option>Bracket Order</option>
                <option>Cover Order</option>
                <option>Regular</option>
              </select>
            </div>
            <div class="form-row">
              <label>Entry Price</label>
              <input type="number" placeholder="72450.00" />
            </div>
            <div class="form-row">
              <label>Stop Loss</label>
              <input type="number" placeholder="72300.00" />
            </div>
            <div class="form-row">
              <label>Take Profit</label>
              <input type="number" placeholder="72600.00" />
            </div>
            <div class="form-row">
              <label>Trailing Stop (points)</label>
              <input type="number" placeholder="50" />
            </div>
            <div class="form-row">
              <label>Trigger Price</label>
              <input type="number" placeholder="72400.00" />
            </div>
          </div>

          <div class="actions" style="margin-top:20px">
            <button class="btn ghost" id="adv_cancel">Cancel</button>
            <button class="btn" id="adv_submit" style="background:linear-gradient(135deg, var(--accent-2), var(--accent));">Submit Order</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT: Compact commodity summary / quick order -->
    <div class="side-card">
      <div class="mini card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:800;font-size:16px">Quick Order</div>
            <div class="muted small">Fast execution panel</div>
          </div>
          <button class="btn ghost" id="open_advanced_side" style="padding:8px 16px">Advanced</button>
        </div>

        <div style="margin-top:16px" class="grid-2">
          <div class="form-row">
            <label>Qty (Lots)</label>
            <input id="side_qty" type="number" value="5" />
          </div>
          <div class="form-row">
            <label>Price</label>
            <input id="side_price" type="number" value="72450.00" />
          </div>
        </div>

        <div class="summary">
          <div class="pill">
            <div class="small muted">Margin Req</div>
            <div id="side_margin" class="large">1,20,000</div>
          </div>
          <div class="pill">
            <div class="small muted">Available</div>
            <div id="side_avail" class="large">2,40,000</div>
          </div>
        </div>

        <div class="actions" style="margin-top:16px">
          <button class="btn buy" id="side_buy">Buy</button>
          <button class="btn sell" id="side_sell">Sell</button>
        </div>
      </div>

      <div class="mini card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700;font-size:15px">Open Positions</div>
            <div class="muted small">Current holdings</div>
          </div>
          <div class="small muted">MTM <span class="success">+3,500</span></div>
        </div>

        <div style="margin-top:14px;display:flex;gap:10px;flex-direction:column">
          <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--input-border)">
            <div class="small muted">5 Buy GOLD</div>
            <div class="small">@ 72,400</div>
          </div>
          <div style="display:flex;justify-content:space-between">
            <div class="small muted">Unrealized P/L</div>
            <div class="small success">+2,500</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // =========================================
    // THEME TOGGLE - FIXED VERSION
    // =========================================
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;
    
    // Load saved theme or default to light
    let currentTheme = localStorage.getItem('theme') || 'light';
    root.setAttribute('data-theme', currentTheme);
    updateToggleButton();

    themeToggle.addEventListener('click', () => {
      currentTheme = currentTheme === 'light' ? 'dark' : 'light';
      root.setAttribute('data-theme', currentTheme);
      localStorage.setItem('theme', currentTheme);
      updateToggleButton();
    });

    function updateToggleButton() {
      themeToggle.textContent = currentTheme === 'light' ? '🌙 Dark' : '☀️ Light';
    }

    // =========================================
    // TAB SWITCHING
    // =========================================
    document.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        btn.classList.add('active');
        const panel = btn.dataset.panel;
        document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
        document.getElementById(panel).style.display = 'block';
      });
    });

    // =========================================
    // CALCULATIONS
    // =========================================
    const comPrice = document.getElementById('com_price');
    const comQty = document.getElementById('com_qty');
    const marginReqEl = document.getElementById('margin_req');
    const availEl = document.getElementById('avail_bal');
    const mtmEl = document.getElementById('mtm');

    function fmt(n) {
      return n.toLocaleString('en-IN');
    }

    function recalc() {
      const price = Number(comPrice.value || 0);
      const qty = Number(comQty.value || 0);
      const margin = Math.round(price * qty);
      const avail = Math.round(240000 - (margin * 0.1));
      const mtm = Math.round((Math.random() - 0.5) * 2000 + 3500);
      
      marginReqEl.textContent = '₹' + fmt(margin);
      availEl.textContent = '₹' + fmt(avail);
      mtmEl.textContent = (mtm > 0 ? '+' : '') + '₹' + fmt(mtm);
      mtmEl.className = 'large ' + (mtm > 0 ? 'success' : 'danger');
    }

    comPrice.addEventListener('input', recalc);
    comQty.addEventListener('input', recalc);
    recalc();

    // =========================================
    // ADVANCED PANEL TOGGLE
    // =========================================
    document.getElementById('open_advanced_side').addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('[data-panel="advanced"]').classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.style.display = 'none');
      document.getElementById('advanced').style.display = 'block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // =========================================
    // RESET BUTTONS
    // =========================================
    document.getElementById('com_reset').addEventListener('click', () => {
      document.getElementById('com_qty').value = 5;
      document.getElementById('com_price').value = 72450;
      recalc();
    });

    document.getElementById('spr_reset').addEventListener('click', () => {
      location.reload();
    });

    // =========================================
    // QUICK ORDER ACTIONS
    // =========================================
    document.getElementById('side_buy').addEventListener('click', () => {
      const q = Number(document.getElementById('side_qty').value);
      const p = Number(document.getElementById('side_price').value);
      alert(`✅ BUY Order Placed\n\nQuantity: ${q} lots\nPrice: ₹${fmt(p)}`);
    });

    document.getElementById('side_sell').addEventListener('click', () => {
      const q = Number(document.getElementById('side_qty').value);
      const p = Number(document.getElementById('side_price').value);
      alert(`✅ SELL Order Placed\n\nQuantity: ${q} lots\nPrice: ₹${fmt(p)}`);
    });

    // =========================================
    // PREVENT SCROLL ON NUMBER INPUTS
    // =========================================
    document.querySelectorAll('input[type=number]').forEach(i => {
      i.addEventListener('wheel', (e) => { e.preventDefault(); });
    });
  </script>
</body>
</html>
